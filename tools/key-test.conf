# Which key combinations reach swinewm, and which ones Windows (Explorer,
# the shell experience hosts) keeps for itself.
#
#   include key-test.conf
#
# Put this file next to your config (%USERPROFILE%\.swinewm\config, or the
# installed one in the SwineWM folder), add the line above at the end of
# the config and reload ($mod+Shift+c). It adds a mode "keytest":
# Ctrl+Alt+K (or swinemsg mode keytest) enters it, and in it every
# combination below shows a notification with its name instead of doing
# what swinewm would do. One that reached swinewm shows its notification;
# one that Windows kept does its Windows thing (or nothing) without a
# notification. Escape leaves the mode. Remove the include line again
# afterwards.
#
# Win+L and Ctrl+Alt+Del are left out: Windows always keeps them.

mode "keytest" {
    bindsym Mod4+a exec notify-send -t 4000 -a keytest "Win+A (quick settings)"
    bindsym Mod4+b exec notify-send -t 4000 -a keytest "Win+B (focus tray)"
    bindsym Mod4+c exec notify-send -t 4000 -a keytest "Win+C (Copilot)"
    bindsym Mod4+d exec notify-send -t 4000 -a keytest "Win+D (show desktop)"
    bindsym Mod4+e exec notify-send -t 4000 -a keytest "Win+E (File Explorer)"
    bindsym Mod4+f exec notify-send -t 4000 -a keytest "Win+F (Feedback Hub)"
    bindsym Mod4+g exec notify-send -t 4000 -a keytest "Win+G (Game Bar)"
    bindsym Mod4+h exec notify-send -t 4000 -a keytest "Win+H (voice typing)"
    bindsym Mod4+i exec notify-send -t 4000 -a keytest "Win+I (Settings)"
    bindsym Mod4+j exec notify-send -t 4000 -a keytest "Win+J"
    bindsym Mod4+k exec notify-send -t 4000 -a keytest "Win+K (Cast)"
    bindsym Mod4+m exec notify-send -t 4000 -a keytest "Win+M (minimize all)"
    bindsym Mod4+n exec notify-send -t 4000 -a keytest "Win+N (notification center)"
    bindsym Mod4+o exec notify-send -t 4000 -a keytest "Win+O (rotation lock)"
    bindsym Mod4+p exec notify-send -t 4000 -a keytest "Win+P (Project)"
    bindsym Mod4+q exec notify-send -t 4000 -a keytest "Win+Q (search)"
    bindsym Mod4+r exec notify-send -t 4000 -a keytest "Win+R (Run)"
    bindsym Mod4+s exec notify-send -t 4000 -a keytest "Win+S (search)"
    bindsym Mod4+t exec notify-send -t 4000 -a keytest "Win+T (taskbar buttons)"
    bindsym Mod4+u exec notify-send -t 4000 -a keytest "Win+U (Accessibility)"
    bindsym Mod4+v exec notify-send -t 4000 -a keytest "Win+V (clipboard history)"
    bindsym Mod4+w exec notify-send -t 4000 -a keytest "Win+W (Widgets)"
    bindsym Mod4+x exec notify-send -t 4000 -a keytest "Win+X (Quick Link menu)"
    bindsym Mod4+y exec notify-send -t 4000 -a keytest "Win+Y"
    bindsym Mod4+z exec notify-send -t 4000 -a keytest "Win+Z (snap layouts)"
    bindsym Mod4+Shift+m exec notify-send -t 4000 -a keytest "Win+Shift+M (restore minimized)"
    bindsym Mod4+Shift+s exec notify-send -t 4000 -a keytest "Win+Shift+S (Snipping Tool)"
    bindsym Mod4+Shift+c exec notify-send -t 4000 -a keytest "Win+Shift+C"
    bindsym Mod4+Shift+v exec notify-send -t 4000 -a keytest "Win+Shift+V"
    bindsym Mod4+Shift+Left exec notify-send -t 4000 -a keytest "Win+Shift+Left (window to monitor)"
    bindsym Mod4+Shift+Right exec notify-send -t 4000 -a keytest "Win+Shift+Right (window to monitor)"
    bindsym Mod4+Shift+Up exec notify-send -t 4000 -a keytest "Win+Shift+Up (stretch)"
    bindsym Mod4+Shift+Down exec notify-send -t 4000 -a keytest "Win+Shift+Down"
    bindsym Mod4+Shift+F23 exec notify-send -t 4000 -a keytest "Win+Shift+F23 (Copilot key)"
    bindsym Mod4+Left exec notify-send -t 4000 -a keytest "Win+Left (snap)"
    bindsym Mod4+Right exec notify-send -t 4000 -a keytest "Win+Right (snap)"
    bindsym Mod4+Up exec notify-send -t 4000 -a keytest "Win+Up (maximize)"
    bindsym Mod4+Down exec notify-send -t 4000 -a keytest "Win+Down (minimize)"
    bindsym Mod4+Home exec notify-send -t 4000 -a keytest "Win+Home (minimize others)"
    bindsym Mod4+Tab exec notify-send -t 4000 -a keytest "Win+Tab (Task View)"
    bindsym Mod4+comma exec notify-send -t 4000 -a keytest "Win+Comma (peek desktop)"
    bindsym Mod4+period exec notify-send -t 4000 -a keytest "Win+Period (emoji)"
    bindsym Mod4+semicolon exec notify-send -t 4000 -a keytest "Win+Semicolon (emoji)"
    bindsym Mod4+space exec notify-send -t 4000 -a keytest "Win+Space (input language)"
    bindsym Mod4+Shift+space exec notify-send -t 4000 -a keytest "Win+Shift+Space (previous language)"
    bindsym Mod4+Return exec notify-send -t 4000 -a keytest "Win+Enter"
    bindsym Mod4+Ctrl+Return exec notify-send -t 4000 -a keytest "Win+Ctrl+Enter (Narrator)"
    bindsym Mod4+plus exec notify-send -t 4000 -a keytest "Win+Plus (Magnifier)"
    bindsym Mod4+minus exec notify-send -t 4000 -a keytest "Win+Minus (Magnifier)"
    bindsym Mod4+Escape exec notify-send -t 4000 -a keytest "Win+Escape"
    bindsym Mod4+Pause exec notify-send -t 4000 -a keytest "Win+Pause (System)"
    bindsym Mod4+Print exec notify-send -t 4000 -a keytest "Win+PrtSc (screenshot)"
    bindsym Mod4+1 exec notify-send -t 4000 -a keytest "Win+1 (taskbar app 1)"
    bindsym Mod4+2 exec notify-send -t 4000 -a keytest "Win+2"
    bindsym Mod4+5 exec notify-send -t 4000 -a keytest "Win+5"
    bindsym Mod4+0 exec notify-send -t 4000 -a keytest "Win+0"
    bindsym Mod4+Shift+1 exec notify-send -t 4000 -a keytest "Win+Shift+1 (new instance)"
    bindsym Mod4+Ctrl+1 exec notify-send -t 4000 -a keytest "Win+Ctrl+1"
    bindsym Mod4+Alt+1 exec notify-send -t 4000 -a keytest "Win+Alt+1 (jump list)"
    bindsym Mod4+Ctrl+d exec notify-send -t 4000 -a keytest "Win+Ctrl+D (new virtual desktop)"
    bindsym Mod4+Ctrl+Left exec notify-send -t 4000 -a keytest "Win+Ctrl+Left (desktop left)"
    bindsym Mod4+Ctrl+Right exec notify-send -t 4000 -a keytest "Win+Ctrl+Right (desktop right)"
    bindsym Mod4+Ctrl+F4 exec notify-send -t 4000 -a keytest "Win+Ctrl+F4 (close desktop)"
    bindsym Mod4+Ctrl+q exec notify-send -t 4000 -a keytest "Win+Ctrl+Q (Quick Assist)"
    bindsym Mod4+Ctrl+Shift+b exec notify-send -t 4000 -a keytest "Win+Ctrl+Shift+B (graphics reset)"
    bindsym Mod4+Alt+b exec notify-send -t 4000 -a keytest "Win+Alt+B (HDR)"
    bindsym Mod4+Alt+d exec notify-send -t 4000 -a keytest "Win+Alt+D (date and time)"
    bindsym Mod4+Alt+h exec notify-send -t 4000 -a keytest "Win+Alt+H"
    bindsym Mod4+Alt+k exec notify-send -t 4000 -a keytest "Win+Alt+K (mute call)"
    bindsym Mod4+Alt+r exec notify-send -t 4000 -a keytest "Win+Alt+R (record)"
    bindsym Mod4+Alt+Print exec notify-send -t 4000 -a keytest "Win+Alt+PrtSc"
    bindsym Mod4+Alt+Up exec notify-send -t 4000 -a keytest "Win+Alt+Up"
    bindsym Mod4+Alt+Down exec notify-send -t 4000 -a keytest "Win+Alt+Down"
    bindsym Mod1+Tab exec notify-send -t 4000 -a keytest "Alt+Tab"
    bindsym Mod1+Shift+Tab exec notify-send -t 4000 -a keytest "Alt+Shift+Tab"
    bindsym Mod1+Escape exec notify-send -t 4000 -a keytest "Alt+Esc"
    bindsym Mod1+F4 exec notify-send -t 4000 -a keytest "Alt+F4"
    bindsym Mod1+space exec notify-send -t 4000 -a keytest "Alt+Space (window menu)"
    bindsym Ctrl+Escape exec notify-send -t 4000 -a keytest "Ctrl+Esc (Start)"
    bindsym Ctrl+Shift+Escape exec notify-send -t 4000 -a keytest "Ctrl+Shift+Esc (Task Manager)"
    bindsym Print exec notify-send -t 4000 -a keytest "PrtSc"
    bindsym Mod1+Print exec notify-send -t 4000 -a keytest "Alt+PrtSc"

    bindsym Escape mode "default"
}

bindsym Ctrl+Mod1+k mode "keytest"
